# Sentinel Redis Config - Optimized for fast in-memory rate limiting

port 6379
bind 0.0.0.0
protected-mode no

# Disable saving to disk for maximum speed (pure in-memory)
save ""
appendonly no

# Evict oldest keys if we run out of memory
maxmemory 512mb
maxmemory-policy allkeys-lru

# Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
